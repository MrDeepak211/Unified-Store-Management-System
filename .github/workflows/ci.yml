name: USMS CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: usms
          POSTGRES_USER: usms
          POSTGRES_PASSWORD: usms_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usms -d usms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://usms:usms_ci_password@localhost:5432/usms
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Export generated pnpm lockfile for reproducible installs
        uses: actions/upload-artifact@v4
        with:
          name: usms-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Test tenant isolation and stock invariants
        run: pnpm --filter @usms/database smoke
      - name: Test API authorization guards
        run: pnpm --filter @usms/api test:auth
      - name: Test API routes with Fastify inject
        run: pnpm --filter @usms/api test:api
      - name: Test authenticated tenant and role boundaries
        run: pnpm --filter @usms/api test:auth-integration
      - name: Test payment refund safety policy
        run: pnpm --filter @usms/api test:payments
      - name: Test idempotency request fingerprints
        run: pnpm --filter @usms/api test:idempotency
      - name: Test POS payment settlement status
        run: pnpm --filter @usms/api test:pos-payment-status
      - name: Test credit receivable arithmetic
        run: pnpm --filter @usms/api test:receivables
      - name: Test POS offline queue tenant isolation
        run: pnpm --filter @usms/pos test:offline-queue
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  restore-lockfile:
    if: github.ref == 'refs/heads/staging' && !hashFiles('pnpm-lock.yaml')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: usms-pnpm-lockfile
          repository: MrDeepak211/Unified-Store-Management-System
          run-id: 45811980737
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./lockfile-artifact
      - name: Restore exact lockfile from successful CI run
        run: |
          set -euo pipefail
          test -f lockfile-artifact/pnpm-lock.yaml
          cp lockfile-artifact/pnpm-lock.yaml pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frozen install
        run: pnpm install --frozen-lockfile
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: commit CI-verified pnpm lockfile"
          git push origin HEAD:staging
