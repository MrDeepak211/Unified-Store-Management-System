name: USMS Staging Database Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-and-smoke:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
      DATABASE_SSL: "true"
      DATABASE_CA_CERT: ${{ secrets.STAGING_DATABASE_CA_CERT }}
    steps:
      - name: Verify staging database secret is configured
        shell: bash
        run: |
          if [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "Missing STAGING_MIGRATION_DATABASE_URL in the staging GitHub environment."
            exit 1
          fi
          if [ -z "$DATABASE_CA_CERT" ]; then
            echo "Missing STAGING_DATABASE_CA_CERT in the staging GitHub environment. Add the Supabase database CA certificate."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply staging migrations
        run: pnpm db:migrate

      - name: Verify tenant isolation and stock invariants
        run: pnpm --filter @usms/database smoke
