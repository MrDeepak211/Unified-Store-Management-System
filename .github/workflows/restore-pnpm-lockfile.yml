name: Restore tested pnpm lockfile (one-time)

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/restore-pnpm-lockfile.yml

permissions:
  contents: write
  actions: read

jobs:
  restore-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: usms-pnpm-lockfile
          repository: MrDeepak211/Unified-Store-Management-System
          run-id: 45811980737
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./lockfile-artifact

      - name: Place lockfile and validate against current manifests
        run: |
          set -euo pipefail
          test -f lockfile-artifact/pnpm-lock.yaml
          cp lockfile-artifact/pnpm-lock.yaml pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Commit lockfile and remove one-time helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-pnpm-lockfile.yml
          git add pnpm-lock.yaml
          git commit -m "build: commit CI-verified pnpm lockfile"
          git push origin HEAD:staging
