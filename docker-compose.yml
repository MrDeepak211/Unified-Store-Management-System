services:
  postgres:
    image: postgres:17-alpine
    container_name: usms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: usms
      POSTGRES_USER: usms
      POSTGRES_PASSWORD: usms_dev_only
    ports:
      - "5432:5432"
    volumes:
      - usms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usms -d usms"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: usms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - usms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  usms_postgres_data:
  usms_redis_data:
