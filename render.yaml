# USMS staging services on Render.
# Linked Blueprint branch: staging
# Secrets are intentionally not committed; Render prompts for sync:false values
# during initial Blueprint creation. Never paste production credentials here.

services:
  - type: web
    name: usms-staging-api
    runtime: docker
    plan: starter
    region: singapore
    branch: staging
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "4000"
      - key: PORT
        value: "4000"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: ORDER_TRACKING_SECRET
        sync: false
      - key: PAYMENT_ENCRYPTION_KEY
        sync: false

  - type: worker
    name: usms-staging-reservation-worker
    runtime: docker
    plan: starter
    region: singapore
    branch: staging
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "3"
      - key: DATABASE_URL
        sync: false
