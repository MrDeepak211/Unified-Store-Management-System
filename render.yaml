# USMS zero-budget staging API on Render.
# This Blueprint intentionally provisions only a free web service.
# The reservation worker stays local during staging; Render background workers
# require a paid instance. Never add paid services without explicit approval.

services:
  - type: web
    name: usms-staging-api
    runtime: docker
    plan: free
    region: singapore
    branch: staging
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "4000"
      - key: PORT
        value: "4000"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: ORDER_TRACKING_SECRET
        sync: false
      - key: PAYMENT_ENCRYPTION_KEY
        sync: false
